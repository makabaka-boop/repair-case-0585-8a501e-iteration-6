[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telemetry-gap-repair"
version = "1.0.0"
description = "Minimum-cost sliding-window DP cover of a satellite telemetry gap"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "pydantic>=2,<3",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["app"]
